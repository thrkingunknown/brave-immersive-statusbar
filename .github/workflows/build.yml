name: Build patch bundle

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Morphe patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Verify bundle exists
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' -print -quit)"
      - name: Generate SHA-256
        shell: bash
        run: |
          cd patches/build/libs
          sha256sum *.mpp > SHA256SUMS.txt
      - name: Upload patch bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: brave-immersive-statusbar-mpp
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
          if-no-files-found: error
