name: Build and publish installable Morphe patch bundle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Create repository Actions secrets GPR_USER and GPR_KEY.
      # GPR_KEY must be a classic PAT with read:packages permission and access to
      # MorpheApp/registry. GITHUB_TOKEN alone may not access another owner's package.
      GPR_USER: ${{ secrets.GPR_USER }}
      GPR_KEY: ${{ secrets.GPR_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Morphe registry credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GPR_USER:-}" || -z "${GPR_KEY:-}" ]]; then
            echo "::error::Missing GPR_USER or GPR_KEY Actions secret. Add a GitHub classic PAT with read:packages access to MorpheApp/registry."
            exit 1
          fi

      - name: Configure private Gradle registry credentials
        shell: bash
        run: |
          set -euo pipefail
          # Morphe's setup reads Gradle properties gpr.user/gpr.key, not custom GPR_* env names.
          # Keep credentials outside the checkout and restrict file permissions.
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$gradle_user_home"
          umask 077
          printf 'gpr.user=%s\ngpr.key=%s\n' "$GPR_USER" "$GPR_KEY" > "$gradle_user_home/gradle.properties"
          chmod 600 "$gradle_user_home/gradle.properties"

      - name: Verify compatibility metadata and runtime bridge
        shell: bash
        run: |
          set -euo pipefail
          test -s patches/src/main/kotlin/app/braveimmersive/patches/shared/Constants.kt
          test -s patches/src/main/kotlin/app/braveimmersive/patches/BraveImmersiveStatusBarPatch.kt
          test -s patches/src/main/kotlin/app/braveimmersive/patches/BraveBetaImmersiveStatusBarPatch.kt
          if grep -R -nE '0xFF[0-9A-Fa-f]{6}([.]toInt\(\))?' patches/src/main/kotlin; then
            echo '::error::App icon colors must be 24-bit 0xRRGGBB, without an alpha byte.'
            exit 1
          fi

      - name: Verify runtime bridge source is present
        shell: bash
        run: |
          set -euo pipefail
          test -s extensions/extension/src/main/java/app/braveimmersive/extension/BraveImmersiveStatusBar.java || {
            echo '::error::Missing BraveImmersiveStatusBar.java. Refusing to build a bundle that cannot execute the injected calls.'
            exit 1
          }

      - name: Clean all previous outputs
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build installable Morphe bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon --stacktrace -Pversion=0.0.0-build.${GITHUB_RUN_NUMBER}

      - name: Generate patch inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:generatePatchesList --no-daemon --stacktrace -Pversion=0.0.0-build.${GITHUB_RUN_NUMBER}

      - name: Validate bundle classes, version, and runtime DEX; stage only the installable file
        run: python3 .github/scripts/validate_mpp.py

      - name: Upload installable bundle only
        uses: actions/upload-artifact@v6
        with:
          name: brave-immersive-statusbar-installable-mpp
          path: |
            dist/*.mpp
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish validated build to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          body: |
            Automated Morphe patch build.

            Bundle version: `0.0.0-build.${{ github.run_number }}`
            Commit: `${{ github.sha }}`
            Branch/ref: `${{ github.ref_name }}`

            This prerelease contains only the validated installable `.mpp` bundle, not the Gradle sources or Javadoc archives.
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.mpp
            dist/SHA256SUMS.txt
