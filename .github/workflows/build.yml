name: Build Morphe Patch

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Keep the Gradle package-registry credentials available to settings.gradle.kts.
# Add MORPHE_GITHUB_TOKEN (PAT with read:packages) in repository Actions secrets
# if the automatic GITHUB_TOKEN cannot read the Morphe registry package.
env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.MORPHE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

concurrency:
  group: morphe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile .mpp patch bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'
          cache-provider: basic

      - name: Build Morphe patch bundle
        run: gradle :patches:buildAndroid --no-daemon --stacktrace

      - name: Verify bundle and create checksum
        shell: bash
        run: |
          set -euo pipefail
          output_dir='patches/build/libs'
          if [[ ! -d "$output_dir" ]]; then
            echo "::error::Expected output directory '$output_dir' was not created."
            exit 1
          fi

          mapfile -t mpp_files < <(find "$output_dir" -maxdepth 1 -type f -name '*.mpp' -print | sort)
          if (( ${#mpp_files[@]} == 0 )); then
            echo "::error::The Gradle build completed without producing a .mpp bundle in $output_dir."
            find "$output_dir" -maxdepth 2 -type f -print || true
            exit 1
          fi

          printf 'Verified Morphe patch bundle(s):\n'
          printf ' - %s\n' "${mpp_files[@]}"
          sha256sum "${mpp_files[@]}" > "$output_dir/SHA256SUMS.txt"
          cat "$output_dir/SHA256SUMS.txt"

      - name: Upload .mpp bundle and checksum
        uses: actions/upload-artifact@v7
        with:
          name: brave-immersive-statusbar-${{ github.sha }}
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          # .mpp bundles are already archive-like; avoid recompressing them.
          compression-level: 0
