name: Build patch bundle

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Clean previous outputs
        run: ./gradlew clean --no-daemon
      - name: Build Morphe patch bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon -Pversion=0.0.0-build.${{ github.run_number }}
      - name: Generate patch inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:generatePatchesList --no-daemon -Pversion=0.0.0-build.${{ github.run_number }}
      - name: Validate inventory and installable bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          inventory = Path("patches-list.json")
          if not inventory.is_file():
              sys.exit("ERROR: generatePatchesList did not create patches-list.json")
          data = json.loads(inventory.read_text(encoding="utf-8"))
          version = str(data.get("version", "")).strip()
          if not version or version.lower() == "unspecified":
              sys.exit(f"ERROR: invalid inventory version: {version!r}")
          expected = {"Brave Immersive Status Bar", "Brave Beta Immersive Status Bar"}
          actual = {p.get("name") for p in data.get("patches", [])}
          missing = expected - actual
          if missing:
              sys.exit(f"ERROR: inventory missing patches: {sorted(missing)}; found {sorted(actual)}")
          bundles = [p for p in Path("patches/build/libs").glob("*.mpp")
                     if not p.name.endswith(("-sources.mpp", "-javadoc.mpp"))]
          if len(bundles) != 1:
              sys.exit(f"ERROR: expected one installable .mpp, found {len(bundles)}: {bundles}")
          if version not in bundles[0].name:
              sys.exit(f"ERROR: inventory version {version!r} does not match bundle {bundles[0].name!r}")
          print(f"Validated {len(actual)} patches, inventory version {version}, bundle {bundles[0]}")
          PY
      - name: Generate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' -print -quit)"
          test -n "$bundle"
          sha256sum "$bundle" > patches/build/libs/SHA256SUMS.txt
      - name: Upload patch bundle and inventory
        uses: actions/upload-artifact@v6
        with:
          name: brave-immersive-statusbar-mpp
          path: |
            patches/build/libs/patches-*.mpp
            patches/build/libs/SHA256SUMS.txt
            patches-list.json
          if-no-files-found: error
