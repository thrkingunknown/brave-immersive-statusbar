name: Build patch bundle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Remove stale build output
        run: rm -rf patches/build

      - name: Build bundle and generate Morphe patch inventory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:generatePatchesList --no-daemon -Pversion=0.0.0-build.${GITHUB_RUN_NUMBER}

      - name: Verify version and both patch entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys

          inventory = Path("patches-list.json")
          if not inventory.is_file():
              sys.exit("ERROR: generatePatchesList did not create patches-list.json")
          data = json.loads(inventory.read_text(encoding="utf-8"))
          version = str(data.get("version", "")).strip()
          if not version or version.lower() == "unspecified":
              sys.exit(f"ERROR: invalid MPP version: {version!r}")
          expected = {"Brave Immersive Status Bar", "Brave Beta Immersive Status Bar"}
          actual = {p.get("name") for p in data.get("patches", [])}
          missing = expected - actual
          if missing:
              sys.exit(f"ERROR: MPP is missing expected patches: {sorted(missing)}; found {sorted(actual)}")
          bundles = list(Path("patches/build/libs").glob("*.mpp"))
          if len(bundles) != 1:
              sys.exit(f"ERROR: expected exactly one .mpp, found {len(bundles)}: {bundles}")
          print(f"Validated {len(actual)} patch entries, version {version}, bundle {bundles[0]}")
          PY

      - name: Generate SHA-256
        shell: bash
        run: |
          cd patches/build/libs
          sha256sum *.mpp > SHA256SUMS.txt

      - name: Upload patch bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: brave-immersive-statusbar-mpp
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish validated build to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: Build ${{ github.run_number }} (${{ github.sha }})
          body: |
            Automated Morphe patch build.

            Bundle version: `0.0.0-build.${{ github.run_number }}`
            Commit: `${{ github.sha }}`
            Branch/ref: `${{ github.ref_name }}`

            This is a validated prerelease build, not a semantic version release.
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
