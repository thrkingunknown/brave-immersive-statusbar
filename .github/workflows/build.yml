name: Build Morphe Patch

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.MORPHE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

concurrency:
  group: morphe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Morphe patches
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.1'
          cache-provider: basic

      - name: Remove stale build output
        run: gradle clean --no-daemon --stacktrace

      - name: Build Morphe .mpp bundle
        run: gradle :patches:buildAndroid --no-daemon --stacktrace

      - name: Generate template-compatible patch list
        run: gradle :patches:generatePatchesList --no-daemon --stacktrace

      - name: Verify both patches were discovered
        shell: bash
        run: |
          set -euo pipefail
          test -f patches-list.json || { echo '::error::patches-list.json was not generated'; exit 1; }
          jq -e '
            (.patches | length) == 2 and
            ([.patches[].name] | sort) == [
              "Brave Beta: Immersive status bar on hidden address bar",
              "Brave: Immersive status bar on hidden address bar"
            ]
          ' patches-list.json >/dev/null || {
            echo '::error::Expected both named Brave patches in patches-list.json; refusing to publish an empty/partial bundle.'
            jq '{version, patchCount: (.patches | length), names: [.patches[].name]}' patches-list.json || true
            exit 1
          }
          echo 'Verified both patch entries:'
          jq -r '.patches[].name' patches-list.json

      - name: Verify .mpp bundle and create checksum
        shell: bash
        run: |
          set -euo pipefail
          output_dir='patches/build/libs'
          mapfile -t mpp_files < <(find "$output_dir" -maxdepth 1 -type f -name '*.mpp' -print | sort)
          if (( ${#mpp_files[@]} != 1 )); then
            echo "::error::Expected exactly one .mpp in $output_dir; found ${#mpp_files[@]}"
            find "$output_dir" -maxdepth 2 -type f -print || true
            exit 1
          fi
          sha256sum "${mpp_files[0]}" > "$output_dir/SHA256SUMS.txt"
          cat "$output_dir/SHA256SUMS.txt"

      - name: Upload verified bundle and source metadata
        uses: actions/upload-artifact@v7
        with:
          name: brave-immersive-statusbar-${{ github.sha }}
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
            patches-list.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
